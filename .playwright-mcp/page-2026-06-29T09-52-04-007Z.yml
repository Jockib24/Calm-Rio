                - text: Bel appartement T2 de 42m2 au premier étage d'un petit immeuble en plein centre de Royan.
                - text: Vous pourrez ainsi profiter de la plage de la Grande Conche située juste en face de la résidence ainsi que de toutes les commodités accessibles à pied.
                - text: Le logement se compose d'une chambre avec dressing, une salle d'eau ainsi qu'une cuisine entièrement équipée ouverte sur un salon/salle à manger. Un petit balcon donnant sur la rue complète le tout avec un aperçu mer.
                - text: Le logement est équipé du wi-fi.
                - text: Le logement
                - text: Le logement est agréable et lumineux, équipé de tout le nécessaire pour un séjour confortable.
                - text: Le lit dans la chambre est en 140*190, literie neuve de marque Epeda.
                - text: Le salon comprend un canapé convertible avec matelas Bultex en 140.
                - text: Le linge n'est pas compris dans la location (parures de lit, serviettes de bain petites et grandes, tapis de bain, torchons) il est possible de prendre l'option avec CHA CHA Conciergerie lors de la réservation et avant votre arrivée.
                - text: Une autre option serviette de plage est aussi proposée au besoin pour vous faciliter la vie et réduire le poids des bagages.
                - text: Accès des voyageurs
                - text: L'accès à l'appartement se fait par le biais d'une boite à clef sur le pallier de la porte de l'immeuble extérieur.
                - text: Les infos d'accès sont envoyées le jour même à partir de 15h par la messagerie airbnb.
                - text: Le parking est gratuit dans les rues adjacentes.
