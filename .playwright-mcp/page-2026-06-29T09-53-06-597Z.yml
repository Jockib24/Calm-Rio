                    - text: Its light-filled living area invites you to enjoy this exceptional view at any time of day. It features a flat-screen TV and an 80 cm bench, ideal for an extra sleeping space.
                    - text: "The open-plan kitchen allows you to prepare your meals with ease: 4-burner ceramic hob, extractor hood, electric oven, microwave, drip coffee maker, toaster, kettle, tabletop refrigerator, small freezer, and washing machine."
                    - text: The apartment also includes a bedroom with a 140 cm bed and wardrobe, as well as a shower room with WC.
                    - text: Wake up each morning to the sunrise over the sea and the gentle sound of the waves.
