                  - text: Maison neuve au style Oléronais, alliant le style insulaire charentais et contemporain, très lumineuse, avec de beaux volumes, idéalement située entre mer et foret.
                  - text: La maison d’une superficie de 110m² possède un jardin arboré, clos, avec une belle terrasse en bois 50m² orientée plein sud et équipée d’un salon de jardin et de son parasol et une terrasse couverte 17m² équipée d’une table d’extérieur en teck. Un barbecue complète l’équipement.
                  - text: Le logement
                  - text: "La villa se compose d’un vaste salon/salle à manger et grande hauteur sous plafond ; toutes les pièces à vivre ont des baies vitrées ouvrant sur les terrasses. Attenante, la cuisine ouverte est complètement équipée : Lave-vaisselle, réfrigérateur, four, micro-ondes et plaque à induction, le cellier est équipé d’un lave-linge, d’un sèche-linge et d’un congélateur."
                  - text: "La villa possède 3 chambres de 12 m² chacune : 2 chambres avec lit de 160 (*****) et une chambre avec 2 lits de 80 (*****). Une salle de bain avec douche à l’Italienne et un WC suspendu indépendant. Les draps et les draps de bain sont fournis."
                  - text: Pour les équipements bébé, merci de prévenir l'hôte à l'avance.
                  - text: Autres remarques
                  - text: Une prise pour la recharge de votre voiture électrique/hybride est à disposition. Nous demandons un supplément à régler en fin de séjour, avec le relevé de compteur.
                  - text: Un bureau et un écran avec un connecteur HDMI sont à disposition afin de faciliter et rendre le télétravail confortable.
