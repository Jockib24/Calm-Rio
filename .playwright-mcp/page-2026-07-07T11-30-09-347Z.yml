              - img [ref=f15e305]
              - img [ref=f15e307]
              - img [ref=f15e309]
              - img [ref=f15e311]
            - paragraph [ref=f15e313]: J'ai passé un mois en télétravail depuis cette villa et c'était parfait. Le bureau avec l'écran HDMI est très pratique, la connexion wifi est stable. Le soir, barbecue sur la terrasse et balade en forêt. Le village de Saint-Trojan est charmant avec tous les commerces nécessaires. Je recommande particulièrement pour les longs séjours.
          - generic [ref=f15e314]:
