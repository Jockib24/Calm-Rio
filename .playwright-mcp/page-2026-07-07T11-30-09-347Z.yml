              - img [ref=f15e291]
              - img [ref=f15e293]
            - paragraph [ref=f15e295]: Quelle belle découverte que cette villa sur l'île d'Oléron ! Tout est neuf, propre et très bien pensé. Les trois chambres sont spacieuses, la cuisine hyper bien équipée. Nous avons adoré la situation entre forêt et mer — les balades à vélo jusqu'à la plage sont un régal. Agnès est une hôte formidable, aux petits soins. Nous reviendrons !
          - generic [ref=f15e296]:
            - generic [ref=f15e297]:
              - generic [ref=f15e298]: T
              - generic [ref=f15e299]:
                - generic [ref=f15e300]: Thomas
