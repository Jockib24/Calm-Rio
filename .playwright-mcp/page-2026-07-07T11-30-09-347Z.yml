            - paragraph [ref=f15e277]: Séjour fantastique dans cette villa neuve décorée avec beaucoup de goût. La terrasse plein sud est un vrai bonheur, nous y avons pris tous nos repas. Le jardin clos est parfait pour les enfants et notre chien. La plage de Gatseau est accessible facilement à vélo. Agnès est une hôte attentionnée et réactive. Nous recommandons sans hésiter !
          - generic [ref=f15e278]:
            - generic [ref=f15e279]:
              - generic [ref=f15e280]: M
              - generic [ref=f15e281]:
                - generic [ref=f15e282]: Marie & Jean-Paul
