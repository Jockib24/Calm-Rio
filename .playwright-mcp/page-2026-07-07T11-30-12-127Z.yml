        - heading "À propos de cette maison" [level=2] [ref=f16e76]
        - paragraph [ref=f16e77]: Maison individuelle pour 6 personnes comprenant un séjour / salle à manger lumineux, trois chambres confortables — deux avec lit de 160x200cm et une avec deux lits de 90x200cm — une cuisine fonctionnelle, une salle de bains, un WC indépendant, une terrasse et un jardin arboré.
        - paragraph [ref=f16e78]: Idéalement située à proximité de la piste cyclable qui dessert la plage et le centre du village de Saint-Trojan-les-Bains. L'île d'Oléron offre des kilomètres de pistes cyclables sécurisées, parfaites pour les balades en famille.
        - heading "Le confort à la maison" [level=3] [ref=f16e79]
        - paragraph [ref=f16e80]: Draps, serviettes de toilette et torchons sont fournis pour votre confort. Un équipement bébé est disponible sur demande (lit parapluie, chaise haute). Les animaux sont les bienvenus.
        - heading "Idéal pour les familles" [level=3] [ref=f16e81]
        - paragraph [ref=f16e82]: Cette maison est pensée pour les familles. Le jardin arboré offre un espace sécurisé pour les enfants. Pour les familles nombreuses, il est possible de louer également la maison identique située en face, portant la capacité totale à 12 personnes (selon disponibilité).
