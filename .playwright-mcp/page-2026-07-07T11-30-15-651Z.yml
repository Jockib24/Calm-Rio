      - generic [ref=f17e31]:
        - paragraph [ref=f17e32]: CalmRio est né d'une passion pour la côte atlantique française et du désir de partager ses plus beaux refuges. Chaque propriété de notre collection a été sélectionnée pour son caractère unique, son emplacement d'exception et son confort irréprochable.
        - paragraph [ref=f17e33]: De l'appartement contemporain face à la Grande Conche à Royan aux villas familiales entre mer et forêt à Saint-Trojan-les-Bains, nous avons imaginé ces lieux comme des écrins de sérénité pour les familles, les couples et les télétravailleurs en quête d'authenticité.
        - blockquote [ref=f17e34]: “ Nous croyons que les plus beaux souvenirs de vacances naissent dans des lieux où l'on se sent immédiatement chez soi.
