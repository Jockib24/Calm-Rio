      - region "À propos de ce logement" [ref=f5e75]:
        - heading "À propos de ce logement" [level=2] [ref=f5e76]
        - paragraph [ref=f5e77]: Appartement neuf de 60m² avec une terrasse de 20m² alliant un style bord de plage et contemporain, très lumineux, idéalement situé à 100m de la plage de la Grande Conche et à proximité de nombreux commerces du centre-ville.
        - paragraph [ref=f5e78]: Grande pièce de vie avec salon et cuisine / salle à manger. Canapé confortable, cuisine entièrement équipée avec cave à vin de service. Toutes les fenêtres donnent sur la terrasse — partie salon, partie repas, arborée — parfaite pour les repas en plein air.
        - heading "Les chambres" [level=3] [ref=f5e79]
        - paragraph [ref=f5e80]: "L'appartement dispose de deux chambres : la première avec un grand lit de 160cm, télévision et espace de travail équipé d'un écran et câble HDMI ; la seconde avec deux petits lits de 90cm, idéale pour les enfants ou les amis."
        - heading "La salle de bain" [level=3] [ref=f5e81]
        - paragraph [ref=f5e82]: Salle de bain moderne avec douche à l'italienne. Buanderie séparée équipée d'un lave-linge, sèche-linge, fer et table à repasser. WC indépendant pour plus de confort.
        - heading "Idéal pour" [level=3] [ref=f5e83]
        - paragraph [ref=f5e84]: Cet appartement est parfait pour les couples, les familles avec enfants, les télétravailleurs et les amoureux de la plage. L'ascenseur facilite l'accès, et le parking gratuit sur place est un vrai plus à Royan.
