        - generic [ref=f13e39]:
          - generic [ref=f13e40]:
            - heading "Général" [level=2] [ref=f13e41]
            - generic [ref=f13e42]:
              - button "Les animaux sont-ils acceptés ?" [ref=f13e43] [cursor=pointer]:
                - generic [ref=f13e44]: Les animaux sont-ils acceptés ?
                - img [ref=f13e45]
              - paragraph [ref=f13e48]: Oui, les animaux sont acceptés dans toutes nos propriétés. Merci de nous prévenir à l'avance pour que nous puissions préparer l'espace et vous communiquer les éventuelles conditions spécifiques.
            - generic [ref=f13e49]:
              - button "Le parking est-il inclus ?" [ref=f13e50] [cursor=pointer]:
                - generic [ref=f13e51]: Le parking est-il inclus ?
                - img [ref=f13e52]
              - paragraph [ref=f13e55]: Oui, un parking gratuit sur place est disponible à chaque propriété. Aucun supplément n'est facturé.
            - generic [ref=f13e56]:
              - button "Quels sont les horaires d'arrivée et de départ ?" [ref=f13e57] [cursor=pointer]:
                - generic [ref=f13e58]: Quels sont les horaires d'arrivée et de départ ?
                - img [ref=f13e59]
              - paragraph [ref=f13e62]:
                - text: L'arrivée (check-in) se fait à partir de
                - strong [ref=f13e63]: 16h00
                - text: . Pour la villa de Saint-Trojan, l'arrivée est possible entre 16h00 et 20h00. Le départ (check-out) est avant
                - strong [ref=f13e64]: 10h00
                - text: pour toutes les propriétés.
            - generic [ref=f13e65]:
              - button "Le WiFi est-il fourni ?" [ref=f13e66] [cursor=pointer]:
                - generic [ref=f13e67]: Le WiFi est-il fourni ?
                - img [ref=f13e68]
              - paragraph [ref=f13e71]: Oui, toutes nos propriétés disposent du WiFi haut débit. La villa de Saint-Trojan propose également un espace de travail dédié avec bureau, écran et câble HDMI — idéal pour le télétravail.
            - generic [ref=f13e72]:
              - button "Les draps et serviettes sont-ils inclus ?" [ref=f13e73] [cursor=pointer]:
                - generic [ref=f13e74]: Les draps et serviettes sont-ils inclus ?
                - img [ref=f13e75]
              - paragraph [ref=f13e78]: Oui, les draps et serviettes de toilette sont fournis dans toutes nos locations et inclus dans le prix de la réservation.
            - generic [ref=f13e79]:
              - button "Un équipement bébé est-il disponible ?" [ref=f13e80] [cursor=pointer]:
                - generic [ref=f13e81]: Un équipement bébé est-il disponible ?
                - img [ref=f13e82]
              - paragraph [ref=f13e85]: Oui, un équipement bébé (lit parapluie, chaise haute) est disponible sur demande. Merci de nous en informer avant votre arrivée pour que nous puissions tout préparer.
          - generic [ref=f13e86]:
            - heading "Royan — Appartement" [level=2] [ref=f13e87]
            - generic [ref=f13e88]:
              - button "À quelle distance se trouve la plage ?" [ref=f13e89] [cursor=pointer]:
                - generic [ref=f13e90]: À quelle distance se trouve la plage ?
                - img [ref=f13e91]
              - paragraph [ref=f13e94]:
                - text: L'appartement se trouve à environ
                - strong [ref=f13e95]: 100 mètres
                - text: de la plage de la Grande Conche, la plus belle plage de Royan avec ses 2,6 km de sable fin.
            - generic [ref=f13e96]:
              - button "Y a-t-il un ascenseur ?" [ref=f13e97] [cursor=pointer]:
                - generic [ref=f13e98]: Y a-t-il un ascenseur ?
                - img [ref=f13e99]
              - paragraph [ref=f13e102]: Oui, l'immeuble dispose d'un ascenseur. L'appartement est facilement accessible.
            - generic [ref=f13e103]:
              - button "Y a-t-il un espace de travail ?" [ref=f13e104] [cursor=pointer]:
                - generic [ref=f13e105]: Y a-t-il un espace de travail ?
                - img [ref=f13e106]
              - paragraph [ref=f13e109]: Oui, la chambre principale dispose d'un bureau avec écran et câble HDMI, idéal pour le télétravail face à la mer.
            - generic [ref=f13e110]:
              - button "L'appartement est-il climatisé ?" [ref=f13e111] [cursor=pointer]:
                - generic [ref=f13e112]: L'appartement est-il climatisé ?
                - img [ref=f13e113]
              - paragraph [ref=f13e116]: Non, l'appartement ne dispose pas de climatisation. Cependant, sa conception et sa ventilation naturelle offrent un confort agréable, et la proximité de l'océan apporte une brise rafraîchissante.
          - generic [ref=f13e117]:
            - heading "Saint-Trojan — Villa" [level=2] [ref=f13e118]
            - generic [ref=f13e119]:
              - button "À quelle distance se trouve la plage ?" [ref=f13e120] [cursor=pointer]:
                - generic [ref=f13e121]: À quelle distance se trouve la plage ?
                - img [ref=f13e122]
              - paragraph [ref=f13e125]:
                - text: La villa est située entre la forêt et l'océan. Le village, le port ostréicole et les plages sont accessibles à vélo en
                - strong [ref=f13e126]: 5 à 10 minutes
                - text: par les pistes cyclables.
            - generic [ref=f13e127]:
              - button "Y a-t-il un jardin ?" [ref=f13e128] [cursor=pointer]:
                - generic [ref=f13e129]: Y a-t-il un jardin ?
                - img [ref=f13e130]
              - paragraph [ref=f13e133]:
                - text: Oui, la villa dispose d'un
                - strong [ref=f13e134]: jardin privé entièrement clos
                - text: ", d'une terrasse en bois de 50m² et d'une terrasse couverte de 17m² — parfait pour les repas en plein air et les enfants."
            - generic [ref=f13e135]:
              - button "La recharge électrique est-elle disponible ?" [ref=f13e136] [cursor=pointer]:
                - generic [ref=f13e137]: La recharge électrique est-elle disponible ?
                - img [ref=f13e138]
              - paragraph [ref=f13e141]:
                - text: Oui, une
                - strong [ref=f13e142]: borne de recharge pour véhicule électrique
                - text: est disponible. Un supplément basé sur le relevé du compteur est demandé en fin de séjour.
            - generic [ref=f13e143]:
              - button "La villa est-elle climatisée ?" [ref=f13e144] [cursor=pointer]:
                - generic [ref=f13e145]: La villa est-elle climatisée ?
                - img [ref=f13e146]
              - paragraph [ref=f13e149]: Non, mais la villa est conçue avec une excellente ventilation naturelle. Des ventilateurs sont à disposition pour votre confort.
            - generic [ref=f13e150]:
              - button "Peut-on louer pour un grand groupe ?" [ref=f13e151] [cursor=pointer]:
                - generic [ref=f13e152]: Peut-on louer pour un grand groupe ?
                - img [ref=f13e153]
              - paragraph [ref=f13e156]:
                - text: La villa peut accueillir jusqu'à
                - strong [ref=f13e157]: 6 personnes
                - text: . Pour les groupes plus grands, il est possible de louer simultanément la maison identique située en face — sous réserve de disponibilité.
                - link [ref=f13e158] [cursor=pointer]:
                  - /url: contact.html
                  - text: Contactez-nous
                - text: pour en savoir plus.
          - generic [ref=f13e159]:
            - heading "Saint-Trojan — Maison" [level=2] [ref=f13e160]
            - generic [ref=f13e161]:
              - button "À quelle distance se trouve la plage ?" [ref=f13e162] [cursor=pointer]:
                - generic [ref=f13e163]: À quelle distance se trouve la plage ?
                - img [ref=f13e164]
              - paragraph [ref=f13e167]: La maison est située à proximité immédiate de la piste cyclable qui mène à la plage et au village. Le centre du village est à quelques minutes.
            - generic [ref=f13e168]:
              - button "Y a-t-il un jardin ?" [ref=f13e169] [cursor=pointer]:
                - generic [ref=f13e170]: Y a-t-il un jardin ?
                - img [ref=f13e171]
              - paragraph [ref=f13e174]: Oui, la maison dispose d'un jardin arboré et d'une terrasse, parfaits pour profiter du climat doux de l'Île d'Oléron.
            - generic [ref=f13e175]:
              - button "Peut-on louer les deux maisons ensemble ?" [ref=f13e176] [cursor=pointer]:
                - generic [ref=f13e177]: Peut-on louer les deux maisons ensemble ?
                - img [ref=f13e178]
              - paragraph [ref=f13e181]:
                - text: Oui, selon les disponibilités, il est possible de louer les deux maisons ensemble pour les grandes familles ou les groupes d'amis.
                - link [ref=f13e182] [cursor=pointer]:
                  - /url: contact.html
                  - text: Contactez-nous
                - text: pour vérifier les disponibilités.
          - generic [ref=f13e183]:
            - heading "Réservation" [level=2] [ref=f13e184]
            - generic [ref=f13e185]:
              - button "Comment réserver ?" [ref=f13e186] [cursor=pointer]:
                - generic [ref=f13e187]: Comment réserver ?
                - img [ref=f13e188]
              - paragraph [ref=f13e191]: Vous pouvez réserver directement sur ce site ou via Airbnb. Les réservations en direct offrent souvent les meilleurs tarifs, sans frais de plateforme supplémentaires.
            - generic [ref=f13e192]:
              - button "Quelle est la politique d'annulation ?" [ref=f13e193] [cursor=pointer]:
                - generic [ref=f13e194]: Quelle est la politique d'annulation ?
                - img [ref=f13e195]
              - paragraph [ref=f13e198]: Les conditions d'annulation dépendent des dates de séjour et de la plateforme de réservation. Veuillez consulter la page de réservation pour les conditions exactes applicables à votre séjour.
            - generic [ref=f13e199]:
              - button "Proposez-vous des réductions pour longs séjours ?" [ref=f13e200] [cursor=pointer]:
                - generic [ref=f13e201]: Proposez-vous des réductions pour longs séjours ?
                - img [ref=f13e202]
              - paragraph [ref=f13e205]:
                - text: Oui, des
                - strong [ref=f13e206]: réductions mensuelles
                - text: sont disponibles pour les télétravailleurs, les digital nomads et les séjours prolongés.
                - link [ref=f13e207] [cursor=pointer]:
                  - /url: contact.html
                  - text: Contactez-nous
                - text: pour un devis personnalisé.
        - generic [ref=f13e208]:
          - heading "Vous ne trouvez pas votre réponse ?" [level=2] [ref=f13e209]
          - paragraph [ref=f13e210]: Notre équipe est à votre écoute pour toute question. Nous vous répondons sous 1 heure en journée, 7j/7.
