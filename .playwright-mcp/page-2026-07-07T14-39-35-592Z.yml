    - region "Vivez l’Atlantique autrement" [ref=e339]:
      - generic [ref=e341]:
        - generic [ref=e342]: L’expérience CalmRio
        - heading "Vivez l’Atlantique autrement" [level=2] [ref=e343]
        - paragraph [ref=e344]: Entre océan sauvage et forêt de pins, découvrez un art de vivre où le temps ralentit.
      - generic [ref=e345]:
        - generic [ref=e347]: Entre mer et forêt
        - generic [ref=e348]:
          - generic [ref=e349]: Nature & Grand Air
          - heading "Entre mer et forêt" [level=3] [ref=e350]
          - generic [ref=e351]:
            - paragraph [ref=e352]: Imaginez-vous pédaler à travers la forêt domaniale de Saint-Trojan, l’odeur des pins maritimes mêlée aux embruns de l’Atlantique. L’île d’Oléron est un paradis pour les cyclistes, avec plus de 130 km de pistes cyclables qui serpentent entre marais salants, parcs ostréicoles et plages sauvages.
            - paragraph [ref=e353]: À Royan, la Grande Conche déroule ses 2,6 km de sable fin à 100 mètres de notre appartement. Une baignade matinale, un café en terrasse face à l’océan, une promenade au coucher du soleil — ici, la mer fait partie du quotidien. Les célèbres huîtres de Marennes-Oléron et le pineau des Charentes n’attendent que vous au marché couvert.
          - link "Explorer la région" [ref=e355] [cursor=pointer]:
            - /url: /local-guide.html
      - generic [ref=e356]:
        - generic [ref=e358]: Le télétravail en bord de mer
        - generic [ref=e359]:
          - generic [ref=e360]: Télétravail
          - heading "Le télétravail en bord de mer" [level=3] [ref=e361]
          - generic [ref=e362]:
            - paragraph [ref=e363]: Et si votre bureau avait vue sur l’océan ? Nos locations à Royan et Saint-Trojan-les-Bains sont équipées d’espaces de travail dédiés avec écran, câble HDMI et connexion WiFi haut débit. Installez-vous face à la terrasse, laissez la lumière naturelle inonder votre espace de travail et faites une pause baignade entre deux réunions.
            - paragraph [ref=e364]: Loin de l’agitation urbaine, retrouvez le rythme des marées. Le matin, travaillez au calme dans un cadre inspirant. Le soir, explorez les pistes cyclables, dégustez des huîtres au port ostréicole ou profitez simplement du jardin. C’est ça, l’équilibre version CalmRio.
          - link "Voir les espaces de travail" [ref=e366] [cursor=pointer]:
            - /url: "#nos-locations"
