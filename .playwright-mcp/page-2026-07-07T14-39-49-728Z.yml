        - paragraph [ref=f4e30]: Comment nous protégeons vos données personnelles
    - region [ref=f4e31]:
      - generic [ref=f4e32]:
        - heading "1. Collecte des données" [level=2] [ref=f4e33]
        - paragraph [ref=f4e34]: "Nous collectons les données personnelles que vous nous fournissez lors de l'utilisation du formulaire de contact ou du processus de réservation : nom, prénom, adresse email, numéro de téléphone et informations relatives à votre séjour."
        - heading "2. Utilisation des données" [level=2] [ref=f4e35]
        - paragraph [ref=f4e36]: "Vos données sont utilisées exclusivement pour :"
        - list [ref=f4e37]:
          - listitem [ref=f4e38]: Traiter vos demandes de réservation
          - listitem [ref=f4e39]: Répondre à vos questions via le formulaire de contact
          - listitem [ref=f4e40]: Vous envoyer des informations relatives à votre séjour
          - listitem [ref=f4e41]: Améliorer nos services
        - heading "3. Base légale du traitement" [level=2] [ref=f4e42]
        - paragraph [ref=f4e43]: Le traitement de vos données repose sur votre consentement (formulaire de contact) et sur l'exécution d'un contrat (réservation).
        - heading "4. Durée de conservation" [level=2] [ref=f4e44]
        - paragraph [ref=f4e45]: Vos données sont conservées pour la durée nécessaire à la gestion de votre demande ou réservation, puis archivées conformément aux obligations légales.
        - heading "5. Vos droits" [level=2] [ref=f4e46]
        - paragraph [ref=f4e47]: "Conformément au RGPD, vous disposez des droits suivants :"
        - list [ref=f4e48]:
          - listitem [ref=f4e49]: Droit d'accès à vos données
          - listitem [ref=f4e50]: Droit de rectification
          - listitem [ref=f4e51]: Droit à l'effacement (droit à l'oubli)
          - listitem [ref=f4e52]: Droit à la limitation du traitement
          - listitem [ref=f4e53]: Droit à la portabilité
          - listitem [ref=f4e54]: Droit d'opposition
        - paragraph [ref=f4e55]:
          - text: Pour exercer ces droits, contactez-nous à
          - link "contact@calm-rio.com" [ref=f4e56] [cursor=pointer]:
            - /url: mailto:contact@calm-rio.com
          - text: .
        - heading "6. Sécurité" [level=2] [ref=f4e57]
        - paragraph [ref=f4e58]: Nous mettons en œuvre des mesures techniques et organisationnelles appropriées pour garantir la sécurité de vos données personnelles.
        - heading "7. Contact" [level=2] [ref=f4e59]
