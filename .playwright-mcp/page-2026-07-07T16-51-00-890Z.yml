        - heading "Why Advisors Love Classic" [level=2] [ref=f11e333]
        - region "Slides" [ref=f11e337]:
          - generic [ref=f11e338]:
            - group "13 / 13" [ref=f11e339]:
              - generic [ref=f11e340]:
                - generic [ref=f11e342]: They went above and beyond to help me move every booking, add and remove transfers, handle cancellations, and make last-minute name changes—all within 24 hours of travel. Even after the trip, they assisted with documentation for an insurance claim.
                - generic [ref=f11e345]: Cheryl F.
            - group "1 / 13" [ref=f11e346]:
              - generic [ref=f11e347]:
                - generic [ref=f11e349]: There is no other partner in this industry that cares about my business the way Classic does, that actively adapts to how we need to work to serve our clients, and ALWAYS has my back.
                - generic [ref=f11e352]: Tahryn N.
            - group "2 / 13" [ref=f11e353]:
              - generic [ref=f11e354]:
                - generic [ref=f11e356]: Classic has been a cornerstone to my success in the industry. As a new advisor, I could count on Classic’s product line as the standard for what I wanted to offer my clients. Classic’s never lost the human connection. Just like I value personal connection with my clients, Classic’s values personal connections with the advisors and that just makes for a meaningful and supportive partnership.
                - generic [ref=f11e359]: Gina P.
            - group "3 / 13" [ref=f11e360]:
              - generic [ref=f11e361]:
                - generic [ref=f11e363]: Classic Vacations has been a trusted partner for decades. They share my same obsession with quality, attention to detail, and customer service, so they pretty much mirror my company’s ethos. They understand the luxury traveler and go above and beyond what’s necessary and what’s needed, not just for my clients but also for me as an advisor. When I book with Classic, I know I’m backed by an incredible team from the Reservations to Customer Service. They’re just as committed as I am to a flawless vacation experience.
                - generic [ref=f11e366]: Jim A.
            - group "4 / 13" [ref=f11e367]:
              - generic [ref=f11e368]:
                - generic [ref=f11e370]: My first year as an agent I didn’t even know what it meant to scale your business. But when I started working with Classic, I got so much more than just flights and hotels. I got a partner who really understands the luxury travel industry, and because of that, over the years I have seen my business grow substantially. I can’t imagine partnering with anyone else at this point other than Classic.
                - generic [ref=f11e373]: Clare B.
            - group "5 / 13" [ref=f11e374]:
              - generic [ref=f11e375]:
                - generic [ref=f11e377]: I feel like they’re an extension of my own team. They help me look like a hero by helping me craft custom itineraries for my clients. They’re very flexible in coming up with things that can really make me look like I’ve provided something that someone else couldn’t. I couldn’t be the travel advisor I am now without their help.
                - generic [ref=f11e380]: Kirsten P.
            - group "6 / 13" [ref=f11e381]:
              - generic [ref=f11e382]:
                - generic [ref=f11e384]: Classic Vacations Royalty [Rewards] Program is just one of the many benefits to selling and working with Classic. They take wonderful care of our clients and the same for the advisors who work with them.
                - generic [ref=f11e387]: Kim L.
            - group "7 / 13" [ref=f11e388]:
              - generic [ref=f11e389]:
                - generic [ref=f11e391]: There’s nothing like the people at Classic. I never feel like I’m alone. I always have someone I can go to.
                - generic [ref=f11e394]: Jess H.
            - group "8 / 13" [ref=f11e395]:
              - generic [ref=f11e396]:
                - generic [ref=f11e398]: Kicking myself for waiting so long to book Classic! Classic has been seamless, easy to work with, and so supportive! I see a bright future ahead- with a supplier that actually has our back! Grateful.
                - generic [ref=f11e401]: Anneke M.
            - group "9 / 13" [ref=f11e402]:
              - generic [ref=f11e403]:
                - generic [ref=f11e405]: I first fell in love with Classic at E3, and that event truly solidified my belief in your company’s values and approach to travel. Since then, Classic has been the first supplier I introduce to all of my agents.
                - generic [ref=f11e408]: Jennifer O.
            - group "10 / 13" [ref=f11e409]:
              - generic [ref=f11e410]:
                - generic [ref=f11e412]: THANK YOU for your hard work, tireless efforts and help with taking care of our mutual clients. I can't tell you how refreshing it's been to work with you during this incredibly challenging time, and wish ALL suppliers were as easy and willing to work with us as well as you always have for me.
                - generic [ref=f11e415]: Cindy T.
            - group "11 / 13" [ref=f11e416]:
              - generic [ref=f11e417]:
                - generic [ref=f11e419]: Friends, if you need help with something, contact your Classic BDM. They can move mountains (Well not literally, but they can do amazing things!). Thanks Classic Vacations for going above and beyond for us agents!
                - generic [ref=f11e422]: Shelley M.
            - group "12 / 13" [ref=f11e423]:
              - generic [ref=f11e424]:
                - generic [ref=f11e426]: Amazing – I'm a newer agent... and a couple of agents I work with just love y’all. They say it's so easy to get help and you sure have proven that.
                - generic [ref=f11e429]: Jennifer W.
            - group "13 / 13" [ref=f11e430]:
              - generic [ref=f11e431]:
                - generic [ref=f11e433]: They went above and beyond to help me move every booking, add and remove transfers, handle cancellations, and make last-minute name changes—all within 24 hours of travel. Even after the trip, they assisted with documentation for an insurance claim.
                - generic [ref=f11e436]: Cheryl F.
            - group "1 / 13" [ref=f11e437]:
              - generic [ref=f11e438]:
