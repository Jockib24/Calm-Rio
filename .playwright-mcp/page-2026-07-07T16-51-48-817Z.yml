                    - heading "Sardinia, new for 2026" [level=3] [ref=f24e283]
                    - generic [ref=f24e284]: Our most requested destination by our customers and it's easy to see why. Legendary white-sand beaches and electric-blue waters meet authentic mountain villages, rich history, and natural beauty. Our new, hand-picked collection of villas offer exclusive coastal living and bespoke experiences, making Sardinia an irresistible location.
