                  - generic [ref=f24e242]:
                    - heading "Discover The Salento" [level=3] [ref=f24e243]
                    - generic [ref=f24e244]: At the sun-drenched tip of Puglia, The Salento captivates with its baroque towns, ancient olive groves and two spectacular coastlines. A refreshing sea breeze offers welcome relief on warm August days, with hidden coves and golden beaches, exceptional seafood and relaxed coastal living, this corner of southern Italy offers an unforgettable setting for a villa escape.
                    - link "View Villas in The Salento" [ref=f24e245] [cursor=pointer]:
                      - /url: /italy/puglia/the-salento
              - group [ref=f24e246]:
                - generic [ref=f24e248]:
                  - img "Short Stay Offers" [ref=f24e250]
                  - generic [ref=f24e252]:
                    - heading "Short Stay Offers" [level=3] [ref=f24e253]
                    - generic [ref=f24e254]: This summer, a limited number of our finest villas are available for shorter stays. Ideal for those looking to complement a longer Mediterranean journey, or experience villa life for the first time, these properties offer a flexible way to enjoy some of our most popular homes. With limited availability throughout July and August, selected dates also benefit from special savings of up to 50%.
                    - link "View Villas" [ref=f24e255] [cursor=pointer]:
                      - /url: /short-stays-this-summer
              - group [ref=f24e256]:
                - generic [ref=f24e258]:
                  - img "August Villas, Thoughtfully Priced" [ref=f24e260]
                  - generic [ref=f24e262]:
                    - heading "August Villas, Thoughtfully Priced" [level=3] [ref=f24e263]
                    - generic [ref=f24e264]: We know that for many families, August is the only window for a summer escape, and travelling with school-age children comes with its own rhythm. To make things a little easier, we’re offering a little something extra this season. Our exclusive collection of family-friendly villas now includes savings of up to 20%, with all reductions already applied to the price. That means less time calculating and more time planning the kind of holiday that works for everyone.
                    - link "View Villas" [ref=f24e265] [cursor=pointer]:
                      - /url: /collections/august-family-villas-with-reductions
              - group [ref=f24e266]:
                - generic [ref=f24e268]:
                  - img "October Half Term" [ref=f24e270]
                  - generic [ref=f24e272]:
                    - heading "October Half Term" [level=3] [ref=f24e273]
                    - generic [ref=f24e274]: "Autumn is one of the Mediterranean’s most rewarding seasons to travel. For those making the most of a half-term or fall break, (and with many UK schools introducing a two week holiday this year), it’s an ideal time to escape: the sea remains warm, the pace is gentle, and the summer crowds are gone."
                    - link "Book Now" [ref=f24e275] [cursor=pointer]:
                      - /url: "/results?dateSelectionType=flexible&flex_startDate=2026-10-01&flex_endDate=2026-10-31&flex_NumberOfNights=7 "
