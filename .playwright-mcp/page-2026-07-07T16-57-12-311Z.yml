        - paragraph [ref=f104e512]: Mérida is warm all year round. November to April have a mild and delicious spring-like weather. And the absolute best day to visit Mérida is around 1st November for the Día de los Muertos festivities. May to July are hot and humid months so you’d enjoy our pool the most.
