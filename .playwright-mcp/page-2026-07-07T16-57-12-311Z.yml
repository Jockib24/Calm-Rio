          - generic [ref=f104e371]:
            - generic [ref=f104e372]:
              - generic [ref=f104e373]:
                - paragraph [ref=f104e374]: "Behind a severe colonial facade with two doors there is a huge kitchen. Another large twin door gives access to the living room opening to the garden. A long pool is the connection between the colonial volumes and the modernist bungalow at the end of the property where the spacious bedroom is. Adjacent to the bedroom there is an expansive open bathroom where you can shower or bath with a view of the garden. Service areas: lavatories, pantry, supply closets are all cleverly hidden in the door frames so the plan — a total of 520 sqm — is as open as possible."
                - paragraph [ref=f104e375]: The long pool (15 meters) is the center of the house — a pool with a house instead of a house with a pool.
