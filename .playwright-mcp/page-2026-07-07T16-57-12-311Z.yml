        - generic [ref=f104e220]:
          - heading "An introduction to La Tropical" [level=2] [ref=f104e221]
          - generic [ref=f104e223]:
            - generic [ref=f104e224]:
              - paragraph [ref=f104e225]:
                - strong [ref=f104e226]: How would you describe La Tropical in a nutshell?
              - paragraph [ref=f104e227]: La Tropical is a contemporary lush retreat hidden behind one of the many colonial facades of historic Merida. Proportion, space, privacy, nature and calm make it feel like a villa, yet you are in the middle of one of Mexico‘s fastest-growing and safest cities and in the heart of fascinating Yucatán.
              - paragraph [ref=f104e228]:
                - strong [ref=f104e229]: What was your inspiration to buy La Tropical?
              - paragraph [ref=f104e230]: "We discovered La Tropical as Welcome Beyond guests and kept coming back until the opportunity to purchase it became a reality. We fell in love with the house, the pool, the garden and the city. Mérida is a fascinating city in the middle of a thriving region with so much to offer: a network of historic haciendas, Mayan ruins, cenotes and other natural marvels: a colonial city built of stone and stucco in the middle of the jungle. La Tropical offers an oasis-like experience with a modernist look that feels fresh, unpretentious and at the same time completely unique in the city."
              - paragraph [ref=f104e231]:
                - strong [ref=f104e232]: How would you describe the interior design and architecture?
              - paragraph [ref=f104e233]: "The designers of the house would tell us how they would peep through an old door or window to discover long-abandoned plots with overgrown gardens. That was their inspiration when designing it: indoor and outdoor all merged and all in a long view from the entrance door."
              - paragraph [ref=f104e234]: We also appreciate how clean and modern the design is, as opposed to everything else in Mérida. The designers didn't want to do faux-Mexican. The colonial space in the front of the house was respected, but the rest of the house is a modern take on Mexican brutalism with textured concrete, Mexican stones, woods, and of course, the open relationship between indoor and outdoor.
              - paragraph [ref=f104e235]:
                - strong [ref=f104e236]: To you personally, what is so special about La Tropical?
              - paragraph [ref=f104e237]: "The feeling of being both outdoors and sheltered at the same time. It’s a world within a world: you can experience to the fullest a vibrant Mexican city and minutes later take refuge in a modern oasis, bathed in light, water, plants, the chirping of the birds."
              - paragraph [ref=f104e238]:
                - strong [ref=f104e239]: Please tell us about the food.
              - paragraph [ref=f104e240]: The opportunities to experience the wonderful Mexican cuisine are countless and close by. From popular morning tacos to the best restaurants in Mexico, all are within walking distance.
              - paragraph [ref=f104e241]: If you rather eat at home, there are many little convenience stores around as well as the huge and colourful Lucas de Gálvez Market, which is a 12 minutes walk away.
              - paragraph [ref=f104e242]:
                - strong [ref=f104e243]: Is La Tropical best suited for couples, families, groups? What’s your policy on kids?
              - paragraph [ref=f104e244]: Casa Mérida is designed for couples. Or a very tasteful individual.
              - paragraph [ref=f104e245]:
                - strong [ref=f104e246]: Is there anything else that’s important to know?
              - paragraph [ref=f104e247]: "The bedroom does not have blackout curtains. Instead we favoured natural textiles: thick cotton curtains that allow for a natural wake up light."
              - paragraph [ref=f104e248]: To encourage responsible use of air conditioning, guests are responsible for the electricity they consume over 30kw per day which will suffice with normal use. Electricity is measured per kwh and the meter will be read at check-in and check-out to determine usage. The current rate is 2.4 Mexican pesos per kwh.
              - paragraph [ref=f104e249]: Mérida is in the middle of the Yucatán rainforest and enjoys a tropical climate. Our house is designed to be as open to nature as possible. But nothing is without compromise. Mosquitos, scorpions, spiders and roaches are a natural occurrence. We fumigate for pest control on a regular basis but insects are a fact of life.
            - button "Read more" [ref=f104e250] [cursor=pointer]
