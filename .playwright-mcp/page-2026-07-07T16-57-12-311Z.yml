      - generic [ref=f104e496]:
        - heading "The location of La Tropical" [level=2] [ref=f104e497]
        - generic [ref=f104e499]:
          - generic [ref=f104e500]:
            - paragraph [ref=f104e501]: La Tropical is in a very peaceful and charming part of Merida‘s historical center. The closest cities are Izamal, Valladolid and Campeche. Mérida is surrounded by gorgeous cenotes (sunken lakes in which you can swim), charming haciendas, virgin beaches and last but not at all least, the impressive Mayan sites.
            - paragraph [ref=f104e502]: "Yucatán has a specific character. It has traditionally been an isolated part of México so it retains a lot of authenticity. And Mérida is a gem of a city: the safest in Mexico, with a provincial atmosphere, yet with cosmopolitan touches. People are very laid back and gentle."
          - button "Read more" [ref=f104e503] [cursor=pointer]
