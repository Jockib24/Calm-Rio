            - generic [ref=f104e455]:
              - generic [ref=f104e456]:
                - paragraph [ref=f104e457]: "Around Mérida, there is an infinity of amazing experiences. If you are into history, Mérida is a treasure trove: Archeological sites, a colonial center, haciendas... For the adventurers we advise visiting the many cenotes, kayaking in the mangroves or going horseback riding on the beach."
                - paragraph [ref=f104e458]: Progreso is the nearest coastal town, 45 minutes away from the center. Our favourite beach is Sisal. The trip takes roughly an hour and you will find long extensions of dunes and mangroves along a very peaceful beach.
                - paragraph [ref=f104e459]: Wildlife lovers will love to visit the reserve of Celestún, especially in the flamingo season (November-February).
                - paragraph [ref=f104e460]: "Our personal highlights in the region around Merida are: 1) Uxmal (an incredible ancient Mayan city) 2) Cenotes (the sunken lakes you can swim in) 3) Haciendas (Sisal estates)"
              - button "Read more" [ref=f104e461] [cursor=pointer]
