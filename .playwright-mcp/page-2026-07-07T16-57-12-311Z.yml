              - generic [ref=f104e433]:
                - paragraph [ref=f104e434]: Privacy is always one of our main concerns. This is why we decided to offer our guests a fridge full of breakfast basics and a basket with a selection of carefully chosen organic local produce.
                - paragraph [ref=f104e435]: We found out that having a massage in our garden is pure bliss, so we partnered with a women-owned local company to offer treatments next to the pool.
                - paragraph [ref=f104e436]: A lot of our guests are here on their honeymoons. Extra flowers, champagne or wine are regular requests. Also, we offer a private chef on request.
