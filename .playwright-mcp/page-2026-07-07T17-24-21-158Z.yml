                  - paragraph [ref=e680]: For design-minded iconoclasts
                  - paragraph [ref=e681]: June 2018
                - paragraph [ref=e683]: Founders Oliver and Chris Laugsch, Berlin-based brothers, curated a collection of unusual houses (and small hotels) in 41 countries that they say favor personality over pretension. That might mean a rustic 19th-century barn in Tivoli, N.Y., with curtains for walls or a fully staffed Swahili beach house built by native artisans on Kenya’s Lamu Island.
