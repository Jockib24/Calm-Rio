                  - paragraph [ref=e674]: November 2020
                - paragraph [ref=e676]: Wow is what you’ll utter when you step into any one of Welcome Beyond’s properties, available in dozens of countries from Mexico to Germany. Personal touches (you actually know who the owners are) and design feature heavily in their preened pads — from mirror-clad houses in the wilds of Italy to California farmhouses — and while they do cater for that top end of the spectrum, there are plenty of flash places to be had at real-people prices, too.
              - generic [ref=e677]:
