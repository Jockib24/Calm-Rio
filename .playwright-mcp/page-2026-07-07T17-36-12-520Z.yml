            - heading "À propos de cette villa" [level=2] [ref=f1e94]
            - paragraph [ref=f1e95]: Maison neuve au style Oléronais, alliant le style insulaire charentais et contemporain, très lumineuse, avec de beaux volumes, idéalement située entre mer et forêt. 110m² sur un jardin arboré et clos, avec terrasse en bois de 50m² plein sud — salon de jardin, parasol — et terrasse couverte de 17m² avec table en teck. Barbecue à disposition.
            - paragraph [ref=f1e96]: "Vaste salon / salle à manger avec grande hauteur sous plafond, baies vitrées donnant sur les terrasses. Cuisine ouverte équipée : lave-vaisselle, réfrigérateur, four, micro-ondes, plaque à induction. Cellier avec lave-linge, sèche-linge et congélateur."
            - heading "Les chambres" [level=3] [ref=f1e97]
            - paragraph [ref=f1e98]: "3 chambres de 12m² chacune : deux avec lit de 160cm, une avec deux lits de 80cm. Chaque chambre est pensée pour le confort avec une décoration apaisante aux tons naturels."
            - heading "Salle de bain" [level=3] [ref=f1e99]
            - paragraph [ref=f1e100]: Salle de bain moderne avec douche à l'italienne et WC suspendu indépendant. Draps et draps de bain fournis.
            - heading "Télétravail" [level=3] [ref=f1e101]
            - paragraph [ref=f1e102]: Un bureau équipé d'un écran HDMI est à votre disposition pour travailler dans un cadre exceptionnel, entre forêt et océan.
            - heading "Véhicule électrique" [level=3] [ref=f1e103]
            - paragraph [ref=f1e104]: Une prise de recharge pour véhicule électrique ou hybride est disponible sur place. Un supplément basé sur le relevé du compteur est demandé en fin de séjour.
