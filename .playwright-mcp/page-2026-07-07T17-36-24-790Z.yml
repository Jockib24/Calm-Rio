            - heading "À propos de cette maison" [level=2] [ref=f2e91]
            - paragraph [ref=f2e92]: Maison individuelle pour 6 personnes comprenant un séjour / salle à manger lumineux, trois chambres confortables — deux avec lit de 160x200cm et une avec deux lits de 90x200cm — une cuisine fonctionnelle, une salle de bains, un WC indépendant, une terrasse et un jardin arboré.
            - paragraph [ref=f2e93]: Idéalement située à proximité de la piste cyclable qui dessert la plage et le centre du village de Saint-Trojan-les-Bains. L'île d'Oléron offre des kilomètres de pistes cyclables sécurisées, parfaites pour les balades en famille.
            - heading "Le confort à la maison" [level=3] [ref=f2e94]
            - paragraph [ref=f2e95]: Draps, serviettes de toilette et torchons sont fournis pour votre confort. Un équipement bébé est disponible sur demande (lit parapluie, chaise haute). Les animaux sont les bienvenus.
            - heading "Idéal pour les familles" [level=3] [ref=f2e96]
            - paragraph [ref=f2e97]: Cette maison est pensée pour les familles. Le jardin arboré offre un espace sécurisé pour les enfants. Pour les familles nombreuses, il est possible de louer également la maison identique située en face, portant la capacité totale à 12 personnes (selon disponibilité).
