                  - text: Appartement neuf de 60m2 avec une terrasse de 20m2 alliant un style bord de plage et contemporain, très lumineux, idéalement situé à 100m de la plage de la Grande Conche et à proximité de nombreux commerces du centre-ville.
                  - text: Le logement
                  - text: L’appartement comporte d’une grande pièce de vie avec un salon et une cuisine / salle à manger. Vous pourrez retrouver un canapé confortable dans le salon et la cuisine est entièrement équipée, dont une cave à vin de service.
                  - text: Toutes les fenêtres donnent sur la terrasse qui se compose d’une partie salon et d’une partie dédiée aux repas. Elle est arborée pour son coté chaleureux et son ombre naturelle.
                  - text: Vous aurez à votre disposition 2 chambres, l’une avec un grand lit de 160, une télé, ainsi qu’un espace de travail permettant le télétravail (écran et câble hdmi). L’autre se compose de 2 petits lits de 90. Les draps, ainsi que les serviettes, sont fournis.
                  - text: Dans la salle de bain, il y a une douche à l’italienne, ainsi que la buanderie (lave-linge, sèche-linge, fer et table à repasser). Le WC est indépendant.
                  - text: Pour les équipements bébé, merci de prévenir l’hôte à l’avance, ils seront mis à votre disposition.
                  - text: Détails de l'enregistrement
