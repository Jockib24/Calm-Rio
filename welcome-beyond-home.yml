          - listitem [ref=f58e741]:
            - link "Exploring the world doesn’t mean you should leave your love for design and architecture behind. Our modern holiday rentals, boutique home rentals and design hotels are architectural gems that make perfect destinations for design lovers. Each of them stylish in its own way lets you enjoy architecture and interior design at its best." [ref=f58e742] [cursor=pointer]:
