          - listitem [ref=f58e731]:
            - link "Escape for a summer & beach break, with lazy days spent on the beach in the sun or fun-filled days full of activities. With hot summer destinations in either Europe or in distance picturesque seascapes, there are numerous beach rental houses to spend your summer months." [ref=f58e732] [cursor=pointer]:
