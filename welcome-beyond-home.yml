          - listitem [ref=f58e736]:
            - link "Pick your urban retreat for your next city break from our favourite small boutique hotels and stylish apartment rentals. Take a weekend trip to cities such as London, Paris, Lisbon, Barcelona or Marrakech. Visit museums, go shopping, do some sightseeing, or enjoy international fine dining. After all, you’re only a short flight or train ride away." [ref=f58e737] [cursor=pointer]:
