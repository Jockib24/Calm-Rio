      - generic [ref=f64e493]:
        - heading "The location of La Tropical" [level=2] [ref=f64e494]
        - generic [ref=f64e496]:
          - generic [ref=f64e497]:
            - paragraph [ref=f64e498]: La Tropical is in a very peaceful and charming part of Merida‘s historical center. The closest cities are Izamal, Valladolid and Campeche. Mérida is surrounded by gorgeous cenotes (sunken lakes in which you can swim), charming haciendas, virgin beaches and last but not at all least, the impressive Mayan sites.
            - paragraph [ref=f64e499]: "Yucatán has a specific character. It has traditionally been an isolated part of México so it retains a lot of authenticity. And Mérida is a gem of a city: the safest in Mexico, with a provincial atmosphere, yet with cosmopolitan touches. People are very laid back and gentle."
          - button "Read more" [ref=f64e500] [cursor=pointer]
      - generic [ref=f64e504]:
        - heading "When is the best time to visit Yucatan?" [level=2] [ref=f64e505]
        - paragraph [ref=f64e509]: Mérida is warm all year round. November to April have a mild and delicious spring-like weather. And the absolute best day to visit Mérida is around 1st November for the Día de los Muertos festivities. May to July are hot and humid months so you’d enjoy our pool the most.
